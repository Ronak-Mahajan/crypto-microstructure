name: ci

on:
  push:
    branches:
      - main
      - 'rebuild/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: install
        run: |
          set -o pipefail
          python -m pip install --quiet -r requirements.txt pytest 2>&1 | tee -a ci.log

      - name: compile
        run: |
          python -m py_compile record.py analyze.py tardis_loader.py ofi/*.py 2>&1 | tee -a ci.log
          exit ${PIPESTATUS[0]}

      - name: tests
        run: |
          make test PYTHON=python 2>&1 | tee -a ci.log
          exit ${PIPESTATUS[0]}

      # The real manifest lists the 24 hourly files of the measured day, but
      # those files are gitignored, so `verify` on it can only report them
      # missing. It is therefore run against the committed fixture manifest,
      # which lists three files that ARE in the tree. That checks the shipped
      # bytes against the shipped sha256s on the CI machine (nothing mangled
      # them between here and Linux), and it is the only step that runs the verify path
      # on real input. --strict so "missing" fails rather than passing
      # quietly; the files are committed, so missing means something is
      # wrong.
      - name: loader cli smoke (offline)
        run: |
          set -o pipefail
          python tardis_loader.py --help 2>&1 | tee -a ci.log
          python tardis_loader.py verify --quiet 2>&1 | tee -a ci.log
          python tardis_loader.py verify --strict \
            --manifest tests/fixtures/synthetic/manifest.json 2>&1 | tee -a ci.log
          exit ${PIPESTATUS[0]}

      # The whole measurement pipeline over the committed synthetic fixture:
      # no network, a couple of seconds, and it must write a real (tiny)
      # table. This is what stops book/features/bars/inference/report from
      # silently ceasing to produce results while the unit tests stay green.
      # OUT is a scratch directory, never the committed results/self-test, so
      # CI never rewrites a tracked file.
      - name: pipeline smoke over the synthetic fixture
        run: |
          set -o pipefail
          rm -rf /tmp/smoke
          make smoke PYTHON=python OUT=/tmp/smoke 2>&1 | tee -a ci.log
          exit ${PIPESTATUS[0]}

      - name: the smoke table is real, and labelled as a self-test
        run: |
          set -o pipefail
          {
            OUT=/tmp/smoke/self-test/README.md
            test -s "$OUT" || { echo "FAIL: $OUT missing or empty"; exit 1; }
            test -s /tmp/smoke/self-test/results.json || { echo "FAIL: results.json missing"; exit 1; }
            for want in '## Data' '## (a) CKS' '## (b) Forward' '## (c) Fee hurdle' '## (d) Cross-venue'; do
              grep -qF "$want" "$OUT" || { echo "FAIL: section missing: $want"; exit 1; }
            done
            grep -qF 'NOT A MARKET RESULT' "$OUT" || { echo "FAIL: synthetic banner missing"; exit 1; }
            grep -qE '^\| coinbase/BTC-USD/[0-9-]+ \|' "$OUT" || { echo "FAIL: no day row in the data table"; exit 1; }
            grep -qE '^\| best-level OFI \| 1 s \| -?[0-9]' "$OUT" || { echo "FAIL: no OFI row with a number"; exit 1; }
            # the fee hurdle must keep declaring what share of the out-of-sample
            # set it actually traded; on the fixture at least one row sits on a
            # tied prediction plateau and must say so rather than pass itself
            # off as a clean decile
            grep -qF 'share of OOS' "$OUT" || { echo "FAIL: fee hurdle does not declare its traded share"; exit 1; }
            grep -qF 'tied)' "$OUT" || { echo "FAIL: tied plateau not declared"; exit 1; }
            grep -qF 'spread charged' "$OUT" || { echo "FAIL: fee hurdle does not show the spread it charged"; exit 1; }
            # the pipes in `mean |pred| (bps)` must stay escaped: bare, they
            # end their own cell and the header comes out two cells wider
            # than the separator, so GitHub renders (c) with the last two
            # scenario columns unnamed. tests/test_report.py proves the cell
            # counts match; this is the same check on the shipped artifact.
            # (tests/test_report.py asserts the cell counts match on the
            # report this same code generates; this is the cheap check on
            # the shipped artifact itself.)
            grep -qF 'mean \|pred\| (bps)' "$OUT" || { echo "FAIL: fee hurdle header pipes are not escaped"; exit 1; }
            echo "smoke table OK: $(wc -l < "$OUT") lines"
          } 2>&1 | tee -a ci.log
          exit ${PIPESTATUS[0]}

      # `make results` on the real manifest. Its data files are gitignored, so
      # in a clone every listed file is missing: without ALLOW_MISSING the
      # command must exit 2 and write nothing, and with it the report must
      # say that no day was analysed. This checks the no-data path, never the
      # market numbers; those are reproduced by pulling the day with
      # `make fetch` and running `make results` locally.
      - name: results on the real manifest without its data
        run: |
          set -o pipefail
          {
            rm -rf /tmp/results-real
            set +e
            make results PYTHON=python OUT=/tmp/results-real NBOOT=20
            rc=$?
            set -e
            test "$rc" -ne 0 || { echo "FAIL: results ran without its data files"; exit 1; }
            test ! -e /tmp/results-real || { echo "FAIL: refused run still wrote output"; exit 1; }
            make results PYTHON=python OUT=/tmp/results-real NBOOT=20 ALLOW_MISSING=1
            grep -qF 'No day is analysable yet' /tmp/results-real/README.md \
              || { echo "FAIL: no-data report missing"; exit 1; }
            grep -qF 'files missing (24 file(s)' /tmp/results-real/README.md \
              || { echo "FAIL: missing hours not listed"; exit 1; }
          } 2>&1 | tee -a ci.log
          exit ${PIPESTATUS[0]}

      # On failure, the combined log of every step above is attached to the
      # run as the ci-log artifact.
      - name: upload failure log
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-log
          path: ci.log
          retention-days: 7
          overwrite: true
